# Zasian Aunsorm Gateway — nginx reverse proxy
#
# Bu gateway iki amaca hizmet eder:
#   1. Host erişimi: MyeOffice nginx → host.docker.internal:50010 → bu gateway → auth-service:50011
#   2. Container erişimi: Zasian SFU → zasian-media-network → zasian-aunsorm-gateway:80 → auth-service:50011
#
# Zasian SFU compose dosyasına eklenecek:
#   networks:
#     zasian-media-network:
#       external: true
#       name: zasian-media-network

# WebSocket upgrade map — server bloğundan önce tanımlanmalı
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Compose service adı kullanılır (container adı değil)
upstream aunsorm_auth {
    server auth-service:50011;
    keepalive 32;
}

server {
    # private-documentation-deny: applies before location/proxy selection.
    if ($uri ~* "\.(md|mdc)$") { return 404; }
    # 80   — MyeOffice nginx → host.docker.internal:50010 → gateway:80
    # 50010 — Zasian SFU (container içi): host.docker.internal:50010 → gateway:50010
    #          Linux'ta host.docker.internal kendi başına çözümlenmiyor;
    #          zasian-media-network'te bu container'a alias ile yönlendiriliyor.
    listen 80;
    listen 50010;
    server_name _;

    # Bağlantı timeout'ları
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # Docker DNS: id/rng/e2ee servisleri gateway açılırken ayakta olmasa da nginx başlar.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # Servisler Alt-Svc ile kapalı bir UDP portunu (h3=":50011") ilan etmesin; bu başlık
    # tüketici gateway'leri üzerinden tarayıcıya sızıyordu.
    proxy_hide_header Alt-Svc;

    # Tüketici gateway'i (ör. MyeOffice `location /aunsorm/`) öneki soymadan iletirse
    # istek auth-service'e `/aunsorm/...` olarak ulaşır ve her yol 404 döner.
    # Önek burada da soyulur; zaten soyulmuş istekler etkilenmez. Sorgu dizesi korunur.
    rewrite ^/(?:api/)?aunsorm/?$ / last;
    rewrite ^/(?:api/)?aunsorm(/.*)$ $1 last;

    # Auth-service bu yolları sunmaz; ilgili servislere yönlendirilir (/v1 dahil).
    location ~ ^(/v1)?/id(/|$) {
        set $aun_id_backend http://id-service:50016;
        proxy_pass $aun_id_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^(/v1)?/random(/|$) {
        set $aun_rng_backend http://rng-service:50019;
        proxy_pass $aun_rng_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^(/v1)?/sfu(/|$) {
        set $aun_e2ee_backend http://e2ee-service:50021;
        proxy_pass $aun_e2ee_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://aunsorm_auth;
        proxy_http_version 1.1;

        # WebSocket desteği (Zasian SFU signaling için)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Büyük JWT payload'ları için buffer ayarları
        proxy_buffer_size          16k;
        proxy_buffers              8 16k;
        proxy_busy_buffers_size    32k;
    }
}
